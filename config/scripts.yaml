reset_central_heating_controls_to_on_comfort:
  alias: Reset Central Heating Controls to ON/ECO
  description: ''
  sequence:
  - alias: If outside temperature is < 7C and Season is 'Summer' then set Season to
      'Winter' for today
    if:
    - condition: template
      value_template: '  {{ states(''sensor.outside_temperature'') | float < 7 and
        is_state(''input_select.season'', ''Summer'') }}'
    then:
    - action: input_select.select_option
      metadata: {}
      data:
        option: Winter
      target:
        entity_id: input_select.season
  - action: climate.set_temperature
    metadata: {}
    target:
      entity_id: climate.tado_smart_thermostat_ru2393140992
    data:
      hvac_mode: heat
      temperature: 12
    alias: Climate Set HVAC mode Heat and Target Temperature to 12 degrees
    enabled: false
  - delay:
      hours: 0
      minutes: 0
      seconds: 3
      milliseconds: 0
    enabled: false
  - action: climate.set_hvac_mode
    metadata: {}
    data:
      hvac_mode: heat
    target:
      label_id: radiators
    enabled: false
  - delay:
      hours: 0
      minutes: 0
      seconds: 3
      milliseconds: 0
  - action: select.select_option
    metadata: {}
    data:
      option: Heat only
    target:
      entity_id: select.central_mode
    enabled: false
  - delay:
      hours: 0
      minutes: 0
      seconds: 3
      milliseconds: 0
  - action: scheduler.disable_all
    metadata: {}
    data: {}
  - action: scheduler.enable_all
    metadata: {}
    data: {}
  mode: single
