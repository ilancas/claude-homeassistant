turn_on_front_door_motion_detection:
  sequence:
  - repeat:
      sequence:
      - type: turn_on
        device_id: ec47d01c842e9f2af2a41a17a8f90e97
        entity_id: 1fb83e95114243f2b703fe63823e27e8
        domain: switch
        continue_on_error: true
      - delay:
          hours: 0
          minutes: 0
          seconds: 15
          milliseconds: 0
      until:
      - condition: template
        value_template: '{{ is_state(''switch.front_door_motion_detection'', ''on'')
          or repeat.index == 5 }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not is_state(''switch.front_door_motion_detection'', ''on'')
          }}'
      sequence:
      - data:
          title: Ring Motion Detection Issue
          message: Failed to turn on Front Door Motion Detection after multiple attempts.
            The switch entity might not be updating, or the Ring API is unreachable.
            Check Ring integration and logs.
        action: persistent_notification.create
      - data:
          message: Automation 'Ring Motion Detection' failed after all retries. Check
            switch.front_door_motion_detection state and Ring integration health.
          level: error
        action: system_log.write
  alias: Turn ON Front Door motion detection
  description: ''
  icon: mdi:camera-off-outline
turn_off_front_door_motion_detection:
  sequence:
  - condition: state
    state:
    - 'off'
    entity_id: input_boolean.holiday_mode
  - repeat:
      sequence:
      - type: turn_off
        device_id: ec47d01c842e9f2af2a41a17a8f90e97
        entity_id: 1fb83e95114243f2b703fe63823e27e8
        domain: switch
      - delay:
          hours: 0
          minutes: 0
          seconds: 1
          milliseconds: 0
      until:
      - condition: template
        value_template: '{{ is_state(''switch.front_door_motion_detection'', ''off'')
          or repeat.index == 20 }}'
  alias: Turn OFF Front Door motion detection
  description: ''
  icon: mdi:camera-off-outline
