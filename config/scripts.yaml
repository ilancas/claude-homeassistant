coffee_machine_announce_it_s_up_to_temperature:
  sequence:
  - action: counter.decrement
    metadata: {}
    data: {}
    target:
      entity_id: counter.coffee_machine_cycles
    alias: Counter 'Decrement' on Coffee Machine cycles (in case machine did not reach
      temperature)
  - delay:
      hours: 0
      minutes: 12
      seconds: 0
      milliseconds: 0
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.coffee_machine_status
        state:
        - heating
      sequence:
      - action: input_select.select_option
        metadata: {}
        data:
          option: up to temperature
        target:
          entity_id: input_select.coffee_machine_status
      - alias: // notify snug/kitchen
        parallel:
        - action: notify.send_message
          metadata: {}
          data:
            message: The coffee machine is up to temperature
          target:
            entity_id:
            - notify.echo_kitchen_announce
            - notify.echo_snug_announce
      - action: counter.increment
        metadata: {}
        data: {}
        target:
          entity_id: counter.coffee_machine_cycles
    - conditions:
      - condition: state
        entity_id: input_select.coffee_machine_status
        state:
        - cleaning required
      sequence:
      - action: counter.increment
        metadata: {}
        data: {}
        target:
          entity_id: counter.coffee_machine_cycles
  mode: restart
  alias: Coffee machine - announce it's up to temperature
  description: ''
