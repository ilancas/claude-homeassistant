- id: '1767004791405'
  alias: Garage Door Sensor Failure Watchdog
  description: Identify which specific sensor failed to report based on Master state
  triggers:
  - value_template: '{{ states(''sensor.garage_door_diagnostic_sensor'') != ''Synchronized''
      }}'
    for:
      hours: 0
      minutes: 1
      seconds: 0
      milliseconds: 0
    trigger: template
    alias: When garage door diagnostic shows an error
    id: unsynch
  - value_template: '{{ states(''sensor.garage_door_diagnostic_sensor'') == ''Synchronized''
      }}'
    for:
      hours: 0
      minutes: 1
      seconds: 0
      milliseconds: 0
    trigger: template
    alias: WHen garage door diagnostic changes to 'synchronized'
    id: synch
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - unsynch
      sequence:
      - action: notify.persistent_notification
        metadata: {}
        data:
          title: ⚠️ Garage Door Sensor Fault
          message: "{% set master = states('binary_sensor.master_garage_door') %}
            {% set left =     states('binary_sensor.garage_door_l_contact') %} {%
            set right =     states('binary_sensor.garage_door_r_contact') %}\nThe
            problem sensor says {{ master | upper }}. \n{% if left != master %}FAULT:
            Garage Door (L) is stuck on. {{ left }}\n{% elif right != master %}FAULT:
            Garage Door (R) is stuck on. {{ right }}  {% else %}But both sensors are
            now re-scynched. {% endif %}\nRecyle the door and if that doesn't fix
            it, check for sensor issue such as low battery, poor LQI, or mislignement.
            Repair to Zigbee network if appropriate.\n"
          data:
            notification_id: garage_door
    - conditions:
      - condition: trigger
        id:
        - synch
      sequence:
      - action: persistent_notification.dismiss
        metadata: {}
        data:
          notification_id: garage_door
  mode: restart
- id: '1767256859143'
  alias: 'Heating Conflict: Tado Force Stop & Verify'
  description: Resets Tado to 12C when boiler is OFF and verifies the result.
  triggers:
  - entity_id: sensor.heating_system_diagnostic
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ ''Boiler OFF'' in states(''sensor.heating_system_diagnostic'')
      }}'
  actions:
  - action: notify.persistent_notification
    data:
      title: Heating Sync Error
      message: VTs are OFF but Tado is calling for heat. Attempting reset...
  - action: notify.mobile_app_pixel_9_pro_xl
    data:
