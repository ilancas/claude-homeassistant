- alias: TRV Firmware Update Detected
  description: 'Alerts when a TRV firmware update installs and checks whether Smart
    Temperature Control or temperature sensor source has been reset to default.

    '
  trigger:
  - platform: state
    entity_id:
    - update.dining_radiator
    - update.kitchen_radiator
    - update.snug_radiator
    - update.study_radiator
    - update.lounge_radiator_small
    - update.lounge_radiator_large
    attribute: installed_version
  condition:
  - condition: template
    value_template: "{{ trigger.from_state.attributes.installed_version is not none\n
      \  and trigger.from_state.attributes.installed_version not in ['unknown', 'unavailable']\n
      \  and trigger.to_state.attributes.installed_version is not none\n   and trigger.to_state.attributes.installed_version
      not in ['unknown', 'unavailable']\n   and trigger.from_state.attributes.installed_version
      != trigger.to_state.attributes.installed_version }}\n"
  action:
  - variables:
      base_id: '{{ trigger.entity_id | replace(''update.'', '''') }}'
      trv_name: '{{ trigger.entity_id | replace(''update.'', '''') | replace(''_'',
        '' '') | title }}'
      new_version: '{{ state_attr(trigger.entity_id, ''installed_version'') }}'
      smart_pid_enabled: '{{ states(''number.'' + trigger.entity_id | replace(''update.'',
        '''') + ''_temperature_accuracy'') == ''unavailable'' }}'
      sensor_reverted: '{{ states(''select.'' + trigger.entity_id | replace(''update.'',
        '''') + ''_temperature_sensor_select'') == ''internal'' }}'
  - action: persistent_notification.create
    data:
      title: 'TRV Firmware Updated: {{ trv_name }}'
      message: '**{{ trv_name }}** has been updated to firmware version **{{ new_version
        }}**.

        {% if smart_pid_enabled %} ⚠️ **Smart Temperature Control is re-enabled**
        — disable it in Zigbee2MQTT to restore Versatile Thermostat control. {% endif
        %} {% if sensor_reverted %} ⚠️ **Temperature sensor has reverted to Internal**
        — set it back to External in Zigbee2MQTT. {% endif %} {% if not smart_pid_enabled
        and not sensor_reverted %} ✅ Settings appear correct — no action needed. {%
        endif %}

        '
      notification_id: trv_firmware_{{ trigger.entity_id | replace('update.', '')
        }}
  mode: parallel
  max: 7
  id: 138b1e8046e5472fb4fd4336fa1cffad
- id: '1769000000001'
  alias: 'Heating Conflict: Orphan Boiler Reset'
  description: 'Resets Tado to 12°C when the central boiler is on but no VT is calling
    for heat. Suppressed if stuck valves are already being handled by their own automation.

    '
  triggers:
  - trigger: state
    entity_id: binary_sensor.heating_system_orphan_boiler
    to: 'on'
  conditions:
  - condition: state
    entity_id: binary_sensor.heating_system_stuck_valves
    state: 'off'
  actions:
  - action: notify.persistent_notification
    data:
      title: Heating Sync Error
      message: Boiler is ON but no VT is calling for heat. Resetting Tado to 12°C...
      notification_id: orphan_boiler
  - action: notify.mobile_app_pixel_9_pro_xl
    data:
      title: Orphan Boiler Detected
      message: 'Boiler has been running for 5+ minutes with no VT requesting heat.
        Resetting Tado to 12°C now.

        '
  - action: climate.set_temperature
    target:
      entity_id: climate.tado_smart_thermostat_ru2393140992
    data:
      temperature: 12
      hvac_mode: heat
  - delay: 00:00:30
  - if:
    - condition: template
      value_template: '{{ state_attr(''climate.tado_smart_thermostat_ru2393140992'',
        ''temperature'') | float <= 12 }}

        '
    then:
    - action: notify.mobile_app_pixel_9_pro_xl
      data:
        title: 'Orphan Boiler: Fixed'
        message: Tado successfully reset to 12°C. Boiler should now stop.
    - action: persistent_notification.dismiss
      data:
        notification_id: orphan_boiler
    else:
    - action: notify.mobile_app_pixel_9_pro_xl
      data:
        title: 'Orphan Boiler: FAILED'
        message: 'CRITICAL: Tado is still at {{ state_attr(''climate.tado_smart_thermostat_ru2393140992'',
          ''temperature'') }}°C after reset attempt. Manual intervention required.

          '
        data:
          priority: high
          clickAction: /lovelace-thermostat
  mode: single
