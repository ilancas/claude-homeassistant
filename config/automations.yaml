- id: '1767889271196'
  alias: 'Heating Conflict: No VT Preset, TRV Nudge, or set to Auto'
  description: When a "rogue" state is detected, the supervisor first checks if the
    hardware  is in the wrong mode. If it is, it performs a silent "Force Fix" and
    leaves a log in  your sidebar. If the mode is correct but the temperature has
    changed  significantly, it assumes you want a temporary boost or reduction and
    sets a  30-minute timer, notifying your mobile device for confirmation.
  triggers:
  - trigger: state
    entity_id: binary_sensor.heating_system_rogue_radiator_alert
    to: 'on'
    id: rogue_detected
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: FIX_NOW
    id: force_fix
  actions:
  - if:
    - condition: trigger
      id: force_fix
    then:
    - variables:
        target_vt: '{{ states(''input_text.heating_nudge_entity'') }}'
        room_id: "{{ target_vt.split('.')[1]\n    | replace('_versatile_thermostat',
          '')\n    | replace('_small', '')\n    | replace('_large', '') }}"
        schedule_entity: switch.schedule_{{ room_id }}_heating_schedule
        slot: '{{ state_attr(schedule_entity, ''current_slot'') }}'
        correct_preset: '{{ state_attr(schedule_entity, ''actions'')[slot | int].data.preset_mode
          if slot is not none else ''activity'' }}'
    - if:
      - condition: template
        value_template: '{{ target_vt not in [''unknown'', ''unavailable'', ''none'',
          ''''] }}'
      then:
      - action: versatile_thermostat.cancel_timed_preset
        target:
          entity_id: '{{ target_vt }}'
      - action: climate.set_preset_mode
        target:
          entity_id: '{{ target_vt }}'
        data:
          preset_mode: '{{ correct_preset }}'
      - action: input_text.set_value
        target:
          entity_id: input_text.heating_nudge_entity
        data:
          value: none
      - action: notify.mobile_app_pixel_9_pro_xl
        data:
          message: clear_notification
          data:
            tag: heating_nudge
    - stop: User forced fix.
  - repeat:
      for_each: '{{ state_attr(''binary_sensor.heating_system_rogue_radiator_alert'',
        ''rogue_entities'') | default([], true) }}'
      sequence:
      - variables:
          vt_entity: '{{ repeat.item }}'
          friendly_room: '{{ state_attr(vt_entity, ''friendly_name'') | replace(''
            Versatile Thermostat'', '''') }}'
          raw_requested: '{{ state_attr(vt_entity, ''requested_preset'') }}'
          room_id: "{{ vt_entity.split('.')[1]\n    | replace('_versatile_thermostat',
            '')\n    | replace('_small', '')\n    | replace('_large', '') }}"
          schedule_entity: switch.schedule_{{ room_id }}_heating_schedule
          slot: '{{ state_attr(schedule_entity, ''current_slot'') }}'
          correct_preset: '{{ state_attr(schedule_entity, ''actions'')[slot | int].data.preset_mode
            if slot is not none else ''activity'' }}'
          return_preset: '{{ raw_requested if raw_requested not in [''none'', ''unknown'',
            ''unavailable'', None] else correct_preset }}'
          trv_entity: '{{ state_attr(vt_entity, ''vtherm_over_climate'').underlying_entities[0]
            }}'
          trv_temp: '{{ state_attr(trv_entity, ''temperature'') | float(0) }}'
          presets: '{{ state_attr(vt_entity, ''preset_temperatures'') }}'
          baseline_temp: '{% set p_key = return_preset + ''_temp'' %}  {{ presets.get(p_key)
            | float(19) }}'
          temp_diff: '{{ (trv_temp - baseline_temp) | round(1) }}'
          is_mode_error: "{{ states(trv_entity) == 'auto' or \n   states(trv_entity)
            not in ['heat', 'off'] or\n   (state_attr(vt_entity, 'preset_mode') in
            ['none', none] and (temp_diff | abs) < 0.5) }}"
          target_preset: "{% set ladder = ['eco', 'comfort', 'boost'] %}\n{% set current_idx
            = ladder.index(return_preset) if return_preset in ladder else 1 %}\n{%
            if temp_diff > 0 %}\n  {{ ladder[current_idx + 1] if current_idx < 2 else
            'boost' }}\n{% else %}\n  {{ ladder[current_idx - 1] if current_idx >
            0 else 'eco' }}\n{% endif %}"
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_mode_error }}'
          sequence:
          - action: versatile_thermostat.cancel_timed_preset
            target:
              entity_id: '{{ vt_entity }}'
          - action: climate.set_hvac_mode
            target:
              entity_id: '{{ vt_entity }}'
            data:
              hvac_mode: heat
          - wait_template: '{{ is_state(vt_entity, ''heat'') }}'
            timeout: 00:00:05
          - action: climate.set_preset_mode
            target:
              entity_id: '{{ vt_entity }}'
            data:
              preset_mode: '{{ correct_preset }}'
          - action: persistent_notification.create
            data:
              title: 'Heating Sync: {{ friendly_room }}'
              message: 'Time: {{ now().strftime(''%H:%M:%S'') }} – Mode error (Auto/Manual)
                detected. Restored {{ correct_preset }}.

                '
              notification_id: heating_error_{{ room_id }}
          - if:
            - condition: template
              value_template: '{{ states(''input_text.heating_nudge_entity'') == vt_entity
                }}'
            then:
            - action: input_text.set_value
              target:
                entity_id: input_text.heating_nudge_entity
              data:
                value: none
            - action: notify.mobile_app_pixel_9_pro_xl
              data:
                message: clear_notification
                data:
                  tag: heating_nudge
        - conditions:
          - condition: template
            value_template: '{{ (temp_diff | abs) >= 0.5 }}'
          sequence:
          - action: input_text.set_value
            target:
              entity_id: input_text.heating_nudge_entity
            data:
              value: '{{ vt_entity }}'
          - action: climate.set_preset_mode
            target:
              entity_id: '{{ vt_entity }}'
            data:
              preset_mode: '{{ return_preset }}'
          - action: versatile_thermostat.set_timed_preset
            target:
              entity_id: '{{ vt_entity }}'
            data:
              preset: '{{ target_preset }}'
              duration_minutes: 30
          - action: notify.mobile_app_pixel_9_pro_xl
            data:
              title: 'Nudge: {{ return_preset }} -> {{ target_preset }}'
              message: Setting {{ target_preset }} for 30m in the {{ friendly_room
                }}.
              data:
                tag: heating_nudge
                actions:
                - action: FIX_NOW
                  title: Cancel & Fix Now
  mode: restart
- id: '1767952200835'
  alias: 'Heating Conflict: Radiator temperature source set to ''internal'''
  description: Triggered by hardware sensor change. Always sets TRVs back to 'external'.
    Only resyncs the VT software if the preset has dropped to 'none'.
  triggers:
  - trigger: state
    entity_id: binary_sensor.any_radiator_temperature_sensor_select_internal
    to: 'on'
  actions:
  - variables:
      rogue_vts: "{% set ns = namespace(found=[]) %} {% set all_vts = states.climate
        | selectattr('attributes.vtherm_over_climate', 'defined') | list %} {% for
        vt in all_vts %}\n  {% set trv = vt.attributes.vtherm_over_climate.underlying_entities[0]
        %}\n  {% set dev_id = device_id(trv) %}\n  {% if dev_id %}\n    {% set select_entity
        = device_entities(dev_id) | select('search', 'temperature_sensor_select')
        | first | default(none) %}\n    {% if select_entity and is_state(select_entity,
        'internal') %}\n      {% set ns.found = ns.found + [vt.entity_id] %}\n    {%
        endif %}\n  {% endif %}\n{% endfor %} {{ ns.found }}"
  - action: notify.mobile_app_pixel_9_pro_xl
    data:
      title: Radiator Sensor Alert
      message: "{% if rogue_vts | length == 0 %}\n  Internal sensor alert triggered,
        but no matching TRVs found.\n{% elif rogue_vts | length == 1 %}\n  {{ state_attr(rogue_vts[0],
        'friendly_name') | replace(' Versatile Thermostat', '') }} TRV reset to 'external'.\n{%
        else %}\n  {{ rogue_vts | length }} radiators found in 'internal' mode. Fixing
        hardware...\n{% endif %}"
  - repeat:
      for_each: '{{ rogue_vts }}'
      sequence:
      - variables:
          vt_entity: '{{ repeat.item }}'
          trv_entity: '{{ state_attr(vt_entity, ''vtherm_over_climate'').underlying_entities[0]
            }}'
          select_entity: '{{ device_entities(device_id(trv_entity)) | select(''search'',
            ''temperature_sensor_select'') | first }}'
          room_id: "{{ vt_entity.split('.')[1]\n    | replace('_versatile_thermostat',
            '')\n    | replace('_radiator', '')\n    | replace('_small', '')\n    |
            replace('_large', '') }}"
          schedule_entity: switch.schedule_{{ room_id }}_heating_schedule
          slot: '{{ state_attr(schedule_entity, ''current_slot'') }}'
          correct_preset: '{{ state_attr(schedule_entity, ''actions'')[slot | int].data.preset_mode
            if slot is not none else ''activity'' }}'
      - action: select.select_option
        target:
          entity_id: '{{ select_entity }}'
        data:
          option: external
      - delay: 00:00:01
      - if:
        - condition: template
          value_template: '{{ is_state_attr(vt_entity, ''preset_mode'', ''none'')
            }}'
        then:
        - action: climate.set_preset_mode
          target:
            entity_id: '{{ vt_entity }}'
          data:
            preset_mode: '{{ correct_preset }}'
      - delay: 00:00:01
  mode: single
- id: '1769345330226'
  alias: 'Heating Conflict: Stuck TRV Valves'
  description: Fixes TRV hangs by toggling hardware. Also ensures the Versatile  Thermostat
    software is restored to 'heat' and its correct schedule.
  triggers:
  - trigger: state
    entity_id: binary_sensor.heating_system_stuck_valves
    to: 'on'
  actions:
  - variables:
      offenders: '{{ state_attr(''binary_sensor.heating_system_stuck_valves'', ''stuck_entities'')
        | default([], true) }}'
  - action: notify.mobile_app_pixel_9_pro_xl
    data:
      title: 'TRV valve stuck:'
      message: 'TRV valve nudge performed: {% for t in offenders %} - {{ state_attr(t,
        ''friendly_name'') | replace('' Radiator'', '''') }}{% endfor %}'
      data:
        priority: high
        ttl: 0
        tag: stuck_valve_failure
  - repeat:
      for_each: '{{ offenders }}'
      sequence:
      - variables:
          trv: '{{ repeat.item }}'
          room_id: "{{ trv.split('.')[1]\n    | replace('_versatile_thermostat', '')\n
            \   | replace('_radiator', '')\n    | replace('_small', '')\n    | replace('_large',
            '') }}"
          vt_entity: climate.{{ room_id }}_versatile_thermostat
          schedule_entity: switch.schedule_{{ room_id }}_heating_schedule
          slot: '{{ state_attr(schedule_entity, ''current_slot'') }}'
          correct_preset: '{{ state_attr(schedule_entity, ''actions'')[slot | int].data.preset_mode
            if slot is not none else ''activity'' }}'
      - action: climate.set_hvac_mode
        target:
          entity_id: '{{ trv }}'
        data:
          hvac_mode: 'off'
      - delay: 00:00:05
      - action: climate.set_hvac_mode
        target:
          entity_id: '{{ trv }}'
        data:
          hvac_mode: heat
      - delay: 00:00:05
      - action: climate.set_hvac_mode
        target:
          entity_id: '{{ vt_entity }}'
        data:
          hvac_mode: heat
      - delay: 00:00:05
      - action: climate.set_preset_mode
        target:
          entity_id: '{{ vt_entity }}'
        data:
          preset_mode: '{{ correct_preset }}'
  - delay: 00:10:00
  - if:
    - condition: state
      entity_id: binary_sensor.heating_system_stuck_valves
      state: 'on'
    then:
    - action: notify.mobile_app_pixel_9_pro_xl
      data:
        title: '⚠️ CRITICAL: Valve Hardware Failure'
        message: 'Kickstart failed. The following TRVs are still stuck after a reset:
          {% for t in offenders %} - {{ state_attr(t, ''friendly_name'') | replace(''
          Radiator'', '''') }}{% endfor %}'
        data:
          priority: high
          ttl: 0
          tag: stuck_valve_failure
- id: '1769871187755'
  alias: 'Heating Conflict: Versatile Thermostat Desync'
  description: Handles Software Desyncs (Reload VT Integration).
