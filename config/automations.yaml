- id: '1745145602340'
  alias: Dining Ceiling Light - Toggle light and OFF bypass via wall switch
  description: 'If relay is off, power on relay (always on except after power cut)
    and switch on the light.

    If relay already on (normal), toggle the light >> if then OFF, set the light OFF
    bypass or if then ON, turn off the light OFF bypass so the light stays on.'
  triggers:
  - domain: mqtt
    device_id: f7c0aa89b7d4f6af6b325f42cfa723f0
    type: action
    subtype: toggle
    metadata: {}
    trigger: device
  conditions: []
  actions:
  - if:
    - condition: state
      entity_id: switch.dining_light_relay
      state: 'off'
    then:
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.dining_light_relay
      enabled: true
    - delay:
        hours: 0
        minutes: 0
        seconds: 5
        milliseconds: 0
      alias: Delay 5s to allow smart bulb to initialise
    - action: light.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: light.dining_ceiling_light
    - action: input_boolean.turn_off
      target:
        entity_id:
        - input_boolean.dining_light_off_bypass
      data: {}
      alias: 'Perform action ''Input boolean: Turn off'' on Dining Light OFF bypass
        (lights back to automatic)'
    else:
    - action: light.toggle
      metadata: {}
      data: {}
      target:
        entity_id: light.dining_ceiling_light
    - delay:
        hours: 0
        minutes: 0
        seconds: 5
        milliseconds: 0
    - if:
      - condition: state
        entity_id: light.dining_ceiling_light
        state: 'off'
        alias: If light has just been turned OFF, keep it off.  If turned ON, set
          to PIR mode
      then:
      - action: input_boolean.turn_on
        target:
          entity_id:
          - input_boolean.dining_light_off_bypass
        data: {}
        alias: 'Perform action ''Input boolean: Turn ON'' Dining Light off bypass
          (keep light OFF)'
      else:
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.dining_light_off_bypass
        data: {}
        alias: 'Perform action ''Input boolean: Turn OFF'' Dining Light OFF bypass
          (lights back to PIR)'
      - delay:
          hours: 0
          minutes: 2
          seconds: 0
          milliseconds: 0
      - if:
        - condition: state
          entity_id: light.dining_ceiling_light
          state:
          - 'on'
        - condition: state
          entity_id: binary_sensor.dining_room_combined_presence_sensor
          state:
          - 'off'
        then:
        - action: light.turn_off
          metadata: {}
          target:
            entity_id: light.dining_ceiling_light
          data:
            transition: 5
  mode: restart
- id: '1745249240796'
  alias: Heating - set schedule (Summer/Winter) if at home
  description: ''
  triggers:
  - at:
      entity_id: input_datetime.morning_alarm
      offset: -00:30:00
    trigger: time
  conditions:
  - condition: state
    entity_id: input_boolean.holiday_mode
    state:
    - 'off'
  actions:
  - if:
    - condition: template
      value_template: "{% set start_date = states('input_datetime.summer') %}\n  {%
        set end_date = states('input_datetime.winter') %}\n{% set start_month = start_date[5:7]|int
        %}\n{% set start_day = start_date[8:10]|int %}\n{% set end_month = end_date[5:7]|int
        %}\n{% set end_day = end_date[8:10]|int %}\n{% set current_month = now().month
        %}\n{% set current_day = now().day %}\n\n{% set start_ordinal = start_month
        * 100 + start_day %}\n{% set end_ordinal = end_month * 100 + end_day %}\n{%
        set current_ordinal = current_month * 100 + current_day %}\n\n{% if start_ordinal
        <= end_ordinal %}\n  {# Normal case: date range doesn't cross year boundary
        #}\n  {{ current_ordinal >= start_ordinal and current_ordinal < end_ordinal
        }}\n{% else %}\n  {# Date range crosses year boundary (e.g., Dec 15 to Jan
        15) #}\n  {{ current_ordinal >= start_ordinal or current_ordinal < end_ordinal
        }}\n{% endif %}"
    - condition: numeric_state
      entity_id: sensor.outside_temperature
      above: 7
    then:
    - action: input_select.select_option
      metadata: {}
      data:
        option: Summer
      target:
        entity_id: input_select.season
    - delay:
        hours: 0
        minutes: 0
        seconds: 15
        milliseconds: 0
    - action: input_boolean.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: input_boolean.heating_system_on
    - type: turn_off
      device_id: 76d7978d8d29c87fc982b0ada8eb6a01
      entity_id: 9c3f4a456d8eae3bfed52bd9a5e3aa75
      domain: fan
    - delay:
        hours: 0
        minutes: 1
        seconds: 0
        milliseconds: 0
    - action: select.select_option
      metadata: {}
      data:
        option: Stopped
      target:
        entity_id: select.central_mode
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.tapo_pm11_dehumidifier
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.bedroom_fan_plug
    else:
    - action: input_select.select_option
      metadata: {}
      data:
        option: Winter
      target:
        entity_id: input_select.season
    - delay:
        hours: 0
        minutes: 0
        seconds: 15
        milliseconds: 0
    - action: input_boolean.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: input_boolean.heating_system_on
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.tapo_pm11_dehumidifier
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.tower_fan_power_switch
    - delay:
        hours: 0
        minutes: 1
        seconds: 0
        milliseconds: 0
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.bedroom_fan_plug
    - action: humidifier.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: humidifier.arete_r_two_12l_dehumidifier_air_purifier
  mode: single
- id: '1745258190805'
  alias: Heating - when switch changes state, activate/deactivate system
