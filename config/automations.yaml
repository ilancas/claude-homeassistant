- id: '1764608123066'
  alias: Group Dining Room Sonos with Kitchen on Motion
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.dining_presence_sensor_occupancy
    from: 'off'
    to: 'on'
    id: t1
    trigger: state
  - entity_id:
    - binary_sensor.dining_presence_sensor_occupancy
    from: 'on'
    to: 'off'
    id: t2
    trigger: state
  - entity_id: media_player.sonos_kitchen
    to: playing
    id: t3
    trigger: state
  - event: start
    id: t4
    trigger: homeassistant
  - event_type: automation_reloaded
    id: t5
    trigger: event
  - trigger: state
    entity_id:
    - media_player.sonos_kitchen
    to:
    - idle
    id: t6
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: media_player.sonos_kitchen
      state: playing
    - condition: or
      conditions:
      - condition: state
        entity_id: media_player.sonos_dining
        state: paused
      - condition: state
        entity_id: media_player.sonos_dining
        state: idle
      - condition: template
        value_template: '{{ sonos_target in state_attr(sonos_source, "group_members")
          }}'
    - condition: template
      value_template: '{{ allow_tv or state_attr(sonos_source, "source")  != "TV"
        }}'
  actions:
  - choose:
    - alias: Motion has been detected - group speakers
      conditions:
      - condition: trigger
        id: t1
      sequence:
      - alias: Add the speaker to the group
        data:
          group_members:
          - media_player.sonos_dining
        target:
          entity_id: media_player.sonos_kitchen
        action: media_player.join
    - alias: Motion has no longer been detected - unjoin after delay
      conditions:
      - condition: trigger
        id:
        - t2
        - t6
      - condition: state
        entity_id: binary_sensor.dining_presence_sensor_occupancy
        state:
        - 'off'
      sequence:
      - alias: Wait the number of minutes set in the time delay
        delay:
          minutes: 10
      - alias: Unjoin the speaker from the group
        target:
          entity_id: media_player.sonos_dining
        action: media_player.unjoin
    - conditions:
      - condition: trigger
        id:
        - t3
      - condition: state
        entity_id: binary_sensor.dining_presence_sensor_occupancy
        state:
        - 'on'
      sequence:
      - alias: Add the speaker to the group
        data:
          group_members:
          - media_player.sonos_dining
        target:
          entity_id: media_player.sonos_kitchen
        action: media_player.join
      alias: Kitchen changed to playing  and room already occupied
  mode: restart
  max_exceeded: silent
  variables:
    motion_trigger:
    - binary_sensor.dining_presence_sensor_occupancy
    sonos_source: media_player.sonos_kitchen
    sonos_target: media_player.sonos_dining
    allow_tv: false
    time_delay: 10
