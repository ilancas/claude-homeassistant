- id: '1750513746921'
  alias: Group Lounge Sonos to Kitchen if Lounge or Study occupied
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.study_presence_sensor_occupancy
    - binary_sensor.everything_presence_lite_c23424_occupancy
    from:
    - 'off'
    to:
    - 'on'
    id: t1
    trigger: state
  - entity_id:
    - binary_sensor.study_presence_sensor_occupancy
    - binary_sensor.everything_presence_lite_c23424_occupancy
    from:
    - 'on'
    to:
    - 'off'
    id: t2
    trigger: state
  - entity_id: media_player.kitchen
    to: playing
    id: t3
    trigger: state
  - event: start
    id: t4
    trigger: homeassistant
  - event_type: automation_reloaded
    id: t5
    trigger: event
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: media_player.kitchen
      state: playing
    - condition: or
      conditions:
      - condition: state
        entity_id: media_player.lounge
        state: paused
      - condition: state
        entity_id: media_player.lounge
        state: idle
      - condition: template
        value_template: '{{ sonos_target in state_attr(sonos_source, "group_members")
          }}'
    - condition: template
      value_template: '{{ allow_tv or state_attr(sonos_source, "source")  != "TV"
        }}'
    - condition: and
      conditions:
      - condition: state
        entity_id: media_player.samsung_s95ca_55
        state: 'off'
  actions:
  - choose:
    - alias: Motion has been detected - group speakers
      conditions:
      - condition: trigger
        id: t1
      sequence:
      - alias: Add the speaker to the group
        data:
          group_members:
          - media_player.lounge
        target:
          entity_id: media_player.kitchen
        action: media_player.join
    - alias: Motion has no longer been detected - unjoin after delay
      conditions:
      - condition: trigger
        id: t2
      - condition: state
        state:
        - 'off'
        entity_id: binary_sensor.everything_presence_lite_c23424_occupancy
      - condition: state
        entity_id: binary_sensor.study_presence_sensor_occupancy
        state: 'off'
      sequence:
      - alias: Wait the number of minutes set in the time delay
        delay:
          hours: 0
          minutes: 1
          seconds: 0
          milliseconds: 0
      - condition: state
        entity_id: binary_sensor.patio_door_contact
        state: 'off'
        for:
          hours: 0
          minutes: 1
          seconds: 0
      - alias: Unjoin the speaker from the group
        target:
          entity_id: media_player.lounge
        action: media_player.unjoin
        data: {}
  mode: restart
  max_exceeded: silent
  variables:
    motion_trigger:
    - binary_sensor.hall_presence_sensor_occupancy
    - binary_sensor.study_presence_sensor_occupancy
    sonos_source: media_player.kitchen
    sonos_target: media_player.lounge
    allow_tv: false
    time_delay: 10
