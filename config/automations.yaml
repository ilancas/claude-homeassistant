      include_sun: sun_enabled
      zone: zone.home
      include_device_tracker: zone_enabled
      sun_elevation: 5
      light_transition_off: 2
      dynamic_lighting_dead_zone: 5
      dynamic_lighting_max_brightness: 40
      dynamic_lighting_min_brightness: 10
      dynamic_lighting_heartbeat: 5
      dynamic_lighting_min_colour_temp: 2500
      sun_elevation_rising: 0
      include_bypass:
