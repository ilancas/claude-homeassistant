- id: '1771160036696'
  alias: Dishwasher - status updates between cycles
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.403090530466020356_bsh_common_status_doorstate
    from:
    - 'off'
    to:
    - 'on'
    id: opened
  - trigger: state
    entity_id:
    - binary_sensor.403090530466020356_bsh_common_status_doorstate
    from:
    - 'on'
    id: closed
    to:
    - 'off'
  conditions:
  - condition: state
    entity_id: sensor.403090530466020356_bsh_common_status_operationstate
    state:
    - BSH.Common.EnumType.OperationState.Ready
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.dishwasher_status
      state:
      - Cleaning required
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - opened
      - condition: state
        entity_id: input_select.dishwasher_status
        state:
        - Finished
      sequence:
      - if:
        - condition: state
          entity_id: input_select.dishwasher_status
          state:
          - Finished
          for:
            hours: 0
            minutes: 20
            seconds: 0
        then:
        - action: input_select.select_option
          metadata: {}
          target:
            entity_id: input_select.dishwasher_status
          data:
            option: Unload/Reload
        else:
        - action: input_select.select_option
          metadata: {}
          target:
            entity_id: input_select.dishwasher_status
          data:
            option: Release Steam
        - delay:
            hours: 0
            minutes: 10
            seconds: 0
            milliseconds: 0
        - action: input_select.select_option
          metadata: {}
          target:
            entity_id: input_select.dishwasher_status
          data:
            option: Unload/Reload
    - conditions:
      - condition: trigger
        id:
        - closed
      sequence:
      - action: input_select.select_option
        metadata: {}
        target:
