      night_glow_light_brightness: 1
      include_night_glow_light_control:
      - use_brightness
      include_night_glow_light_colour_control: disable_colour_control
      night_glow_light_colour_temperature: 2500
      include_night_glow: night_glow_enabled
      night_glow_light_transition_on: 2
      night_light_brightness: 5
      night_light_transition_on: 0
      night_light_transition_off: 2
      include_night_light_colour_control: disable_colour_control
      night_light_colour_temperature: 2500
      night_glow_light_transition_off: 5
      dynamic_lighting_state_control_activation_state: 'off'
      include_light_colour_control: disable_colour_control
      motion_bypass_lights_on: []
      include_bypass_auto_off: []
      bypass_auto_off_delay: 1
      night_lights_after_time: 00:00:00
      include_night_light_control:
