# sensors.yaml

# Ian's Combined Presence Sensor (Trigger-based template binary sensor)
- trigger: 
    - platform: state
      entity_id: sensor.pixel_9xl_wi_fi_connection
      id: 'wifi_triggered'
    - platform: state
      entity_id: device_tracker.pixel_9xl_2
      id: 'gps_triggered'
  binary_sensor: 
    - name: "Ian Combined Presence Sensor"
      unique_id: ian_combined_presence_sensor
      icon: mdi:home-account
      device_class: presence
      state: >
        {% set wifi_is_known = is_state('sensor.pixel_9xl_wi_fi_connection', 'lancasi') %}
        {% set gps_is_away = not is_state('device_tracker.pixel_9xl_2', 'home') %}
        
        {% if trigger.id == 'gps_triggered' %}
          {% if gps_is_away %} off {% else %} on
          {% endif %}
        {% else %}
        
        {% if trigger.id == 'wifi_triggered' %}
          {% if wifi_is_known %} on {% else %} {{this.state}}
          {% endif %}
        {% else %}
        
        {{this.state}}
        
        {% endif %}        
        {% endif %}

      attributes:
        wifi_status: "{{ states('sensor.pixel_9xl_wi_fi_connection') }}"
        gps_status: "{{ states('device_tracker.pixel_9xl_2') }}"

